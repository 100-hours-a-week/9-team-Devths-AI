name: Devths-AI 운영 배포

on:
  workflow_dispatch:
    inputs:
      deployment_comment:
        description: '배포 메모 (변경 내용, 이슈 번호 등)'
        required: true
        type: string
        default: 'Manual production deployment'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CODEDEPLOY_APP_NAME: ${{ secrets.CODEDEPLOY_APP_NAME }}
  CODEDEPLOY_DEPLOYMENT_GROUP: ${{ secrets.CODEDEPLOY_GROUP_NAME_V2_PROD }}

jobs:
  # ========================================================
  # 승인 전: 배포 요청 알림
  # ========================================================
  notify-approval-request:
    name: 배포 승인 요청 알림
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 브랜치 검증
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ 운영 배포는 main 브랜치에서만 실행 가능합니다."
            exit 1
          fi
          echo "✅ 브랜치 검증 완료: main"

      - name: Discord 승인 요청 알림
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_URL }}
          status: 'success'
          content: '@everyone'
          title: '🔔 운영 배포 승인 요청'
          description: |
            **배포 요청자**: ${{ github.actor }}
            **브랜치**: `main` @ `${{ github.sha }}`
            **💬 배포 메모**: ${{ inputs.deployment_comment }}
            **🌍 환경**: 🚀 운영(PROD)

            ⏳ **2단계 교차 승인 대기 중...**

            **승인 프로세스**: 1️⃣ DevOps/TechLead → 2️⃣ TeamLead → 🚀 배포 실행

            **승인 방법**: [워크플로우 페이지](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) → **Review deployments** 클릭
          color: 16776960
          username: GitHub AI Approval Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

  # ========================================================
  # 1차 승인
  # ========================================================
  first-approval:
    name: 1차 승인 (DevOps/TechLead)
    runs-on: ubuntu-22.04
    needs: [notify-approval-request]
    environment:
      name: production-approval-1
    steps:
      - name: 1차 승인 완료
        run: echo "✅ 1차 승인 완료 by ${{ github.actor }}"

      - name: Discord 1차 승인 알림
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_URL }}
          status: 'success'
          content: '@everyone'
          title: '✅ 1차 승인 완료 (DevOps/TechLead)'
          description: |
            **1차 승인자**: ${{ github.actor }}
            **💬 배포 메모**: ${{ inputs.deployment_comment }}
            ⏳ **2차 승인 대기 중...**
            **승인 방법**: [워크플로우 페이지](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 65280
          username: GitHub AI Approval Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

  # ========================================================
  # 2차 승인
  # ========================================================
  second-approval:
    name: 2차 승인 (TeamLead)
    runs-on: ubuntu-22.04
    needs: [first-approval]
    environment:
      name: production-approval-2
    steps:
      - name: 2차 승인 완료
        run: echo "✅ 2차 승인 완료 by ${{ github.actor }} — 빌드 시작"

      - name: Discord 2차 승인 알림
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_URL }}
          status: 'success'
          title: '✅ 2차 승인 완료 (TeamLead) — 빌드 시작'
          content: '@everyone'
          description: |
            **2차 승인자**: ${{ github.actor }}
            **💬 배포 메모**: ${{ inputs.deployment_comment }}
            🚀 **모든 승인 완료! ECR 빌드 및 운영 배포가 시작됩니다.**
            **진행 상황**: [워크플로우 페이지](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 3066993
          username: GitHub AI Approval Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

  # ========================================================
  # ECR 이미지 빌드 및 푸시 (2차 승인 후 실행)
  # ========================================================
  build-and-push:
    name: Build & Push to ECR (prod)
    needs: [second-approval]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devths/ai-prod:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/devths/ai-prod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 운영 배포 (빌드 완료 후 CodeDeploy 트리거)
  # ========================================================
  deploy-production:
    name: Production Deployment
    runs-on: ubuntu-22.04
    needs: [second-approval, build-and-push]
    environment:
      name: production
      url: https://www.devths.com
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      deployment_status: ${{ steps.deploy.outputs.deployment_status }}
      deployment_error: ${{ steps.deploy.outputs.deployment_error }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Timestamp
        id: timestamp
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=$(date +'%Y%m%d_%H%M%S')-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Package Deployment Scripts
        id: package
        run: |
          echo "📦 Creating deployment package for PROD..."
          ARTIFACT_NAME="${{ steps.timestamp.outputs.value }}.zip"
          mkdir -p deploy-package

          # 배포 스크립트, appspec, CI/CD 전용 Compose 파일 포함
          cp -r deploy/ deploy-package/
          cp appspec.yml deploy-package/
          cp docker-compose.cicd.yml deploy-package/  # EC2에 복사될 Compose 파일
          cp -r data/ deploy-package/ 2>/dev/null || true # 데이터 디렉터리 (EC2 볼륨 마운트 용도)

          # .deploy-env: 환경 식별 정보
          echo "export DEPLOY_BRANCH=\"main\"" > deploy-package/.deploy-env
          echo "export DEPLOY_TIMESTAMP=\"${{ steps.timestamp.outputs.value }}\"" >> deploy-package/.deploy-env
          echo "export DEPLOY_SHA=\"${{ github.sha }}\"" >> deploy-package/.deploy-env
          echo "export CODEDEPLOY_DEPLOYMENT_GROUP=\"${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }}\"" >> deploy-package/.deploy-env

          # Zip
          cd deploy-package
          zip -r ../$ARTIFACT_NAME .
          cd ..

          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "✅ Package created: $ARTIFACT_NAME"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        id: upload
        run: |
          ARTIFACT_NAME="${{ steps.package.outputs.artifact_name }}"
          S3_KEY="AI/main/$ARTIFACT_NAME"
          aws s3 cp $ARTIFACT_NAME s3://${{ secrets.AWS_S3_BUCKET_PROD }}/$S3_KEY
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "✅ Uploaded to s3://${{ secrets.AWS_S3_BUCKET_PROD }}/$S3_KEY"

      - name: CodeDeploy 배포 시작
        id: deploy
        run: |
          echo "🚀 Starting deployment to Production..."
          S3_KEY="${{ steps.upload.outputs.s3_key }}"

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.AWS_S3_BUCKET_PROD }},key=$S3_KEY,bundleType=zip \
            --description "${{ inputs.deployment_comment }} (by ${{ github.actor }}, sha: ${{ github.sha }})" \
            --query 'deploymentId' \
            --output text)

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployment started: $DEPLOYMENT_ID"
          echo "🔗 AWS Console: https://${{ env.AWS_REGION }}.console.aws.amazon.com/codesuite/codedeploy/deployments/$DEPLOYMENT_ID"

          if aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID; then
            echo "deployment_status=Success" >> $GITHUB_OUTPUT
            echo "✅ Deployment completed successfully!"
          else
            ERROR_MSG=$(aws deploy get-deployment --deployment-id $DEPLOYMENT_ID \
              --query 'deploymentInfo.errorInformation.message' --output text 2>&1 || echo "Unknown error")
            echo "deployment_status=Failed" >> $GITHUB_OUTPUT
            echo "deployment_error=$ERROR_MSG" >> $GITHUB_OUTPUT
            echo "❌ Deployment failed: $ERROR_MSG"
            exit 1
          fi

  # ========================================================
  # Discord 알림
  # ========================================================
  notify-discord:
    runs-on: ubuntu-22.04
    needs: [first-approval, second-approval, deploy-production]
    if: always()
    steps:
      - name: Discord 배포 결과 알림
        if: needs.deploy-production.result == 'success' || needs.deploy-production.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_URL }}
          status: ${{ needs.deploy-production.result == 'success' && 'success' || 'failure' }}
          title: "🚀 운영 배포 결과 [${{ needs.deploy-production.result == 'success' && '✅성공' || '❌실패' }}]"
          content: '@everyone'
          description: |
            **배포 타입**: 수동 배포 (Manual)
            **환경**: 🚀 운영(PROD)
            **트리거**: ${{ github.actor }}
            **브랜치**: `main` @ `${{ github.sha }}`

            **🚀 배포 결과**: ${{ needs.deploy-production.outputs.deployment_status }}
            **🆔 Deployment ID**: `${{ needs.deploy-production.outputs.deployment_id }}`
            **💬 배포 메모**: ${{ inputs.deployment_comment }}
            **🧾 에러**: ${{ needs.deploy-production.outputs.deployment_error || '없음' }}

            **🔗 링크**: [워크플로우 확인하기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: "${{ needs.deploy-production.result == 'success' && 65280 || 16711680 }}"
          username: GitHub AI Production Deploy Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

      - name: Discord 취소 알림
        if: |
          needs.first-approval.result == 'cancelled' ||
          needs.second-approval.result == 'cancelled' ||
          needs.deploy-production.result == 'cancelled'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PROD_URL }}
          status: 'cancelled'
          title: '⚠️ 운영 배포 취소됨'
          content: '@everyone'
          description: |
            **배포 타입**: 수동 배포 (Manual)
            **환경**: 🚀 운영(PROD)
            **취소자**: ${{ github.actor }}
            **💬 배포 메모**: ${{ inputs.deployment_comment }}

            **취소 단계**:
            - 1차 승인: ${{ needs.first-approval.result }}
            - 2차 승인: ${{ needs.second-approval.result }}
            - 배포 실행: ${{ needs.deploy-production.result }}

            **🔗 링크**: [워크플로우 확인하기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 16776960
          username: GitHub AI Production Deploy Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
