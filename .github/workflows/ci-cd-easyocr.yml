
name: EasyOCR Service CI/CD

on:
  push:
    branches: [ "develop", "release/*" ]
    paths:
      - 'easyocr_server/**'
      - '.github/workflows/ci-cd-easyocr.yml'
  pull_request:
    branches: [ "develop", "release/*" ]
    paths:
      - 'easyocr_server/**'
  workflow_dispatch:

jobs:
  # ========================================================
  # Job 1: Build & Deploy EasyOCR
  # ========================================================
  deploy-easyocr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine Target Environment & Names
        id: env-decision
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "repo_name=devths/easyocr-dev" >> $GITHUB_OUTPUT
            echo "deploy_group=${{ secrets.CODEDEPLOY_GROUP_NAME_GPU_DEV }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/release"* ]]; then
             echo "repo_name=devths/easyocr-stg" >> $GITHUB_OUTPUT
             echo "deploy_group=${{ secrets.CODEDEPLOY_GROUP_NAME_GPU_STG }}" >> $GITHUB_OUTPUT
          else
             echo "repo_name=devths/easyocr-dev" >> $GITHUB_OUTPUT
             echo "deploy_group=${{ secrets.CODEDEPLOY_GROUP_NAME_GPU_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./easyocr_server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.env-decision.outputs.repo_name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.env-decision.outputs.repo_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # Packaging CodeDeploy Scripts specifically for GPU Servers
      # ========================================================
      - name: Generate Timestamp
        id: timestamp
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=$(date +'%Y%m%d_%H%M%S')-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Package Deployment Scripts (EasyOCR variant)
        id: package
        run: |
          echo "📦 Creating GPU deployment package..."
          ARTIFACT_NAME="easyocr-${{ steps.timestamp.outputs.value }}.zip"
          mkdir -p deploy-package/deploy/easyocr
          
          # Copy ONLY easyocr deployment scripts and the specialized appspec
          cp deploy/easyocr/*.sh deploy-package/deploy/easyocr/
          cp appspec-easyocr.yml deploy-package/appspec.yml
          
          # Create tracking env
          echo "export DEPLOY_BRANCH=\"${{ github.ref_name }}\"" > deploy-package/deploy/easyocr/.deploy-env
          echo "export DEPLOY_TIMESTAMP=\"${{ steps.timestamp.outputs.value }}\"" >> deploy-package/deploy/easyocr/.deploy-env
          echo "export DEPLOY_SHA=\"${{ github.sha }}\"" >> deploy-package/deploy/easyocr/.deploy-env

          cd deploy-package
          zip -r ../$ARTIFACT_NAME .
          cd ..
          
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload GPU Artifact to S3
        id: upload
        run: |
          echo "☁️ Uploading to S3..."
          ARTIFACT_NAME="${{ steps.package.outputs.artifact_name }}"
          S3_KEY="AI-EasyOCR/${{ github.ref_name }}/$ARTIFACT_NAME"
          aws s3 cp $ARTIFACT_NAME s3://${{ secrets.AWS_S3_BUCKET }}/$S3_KEY
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT

      - name: Trigger CodeDeploy for GPU Instances
        id: codedeploy
        run: |
          echo "🚀 Triggering EasyOCR GPU CodeDeploy..."
          S3_KEY="${{ steps.upload.outputs.s3_key }}"
          DEPLOY_GROUP="${{ steps.env-decision.outputs.deploy_group }}"
          
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name $DEPLOY_GROUP \
            --s3-location bucket=${{ secrets.AWS_S3_BUCKET }},key=$S3_KEY,bundleType=zip \
            --description "GPU OCR Deploy - ${{ github.ref_name }} - ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployment started: $DEPLOYMENT_ID"

          if aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID; then
            echo "deployment_status=Success" >> $GITHUB_OUTPUT
            echo "✅ GPU OCR Deployment completed successfully!"
          else
            echo "deployment_status=Failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  # ========================================================
  # Job 2: Discord Notification
  # ========================================================
  notify-discord-easyocr:
    runs-on: ubuntu-latest
    needs: [deploy-easyocr]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_NON_PROD_URL }}
          status: ${{ (needs.deploy-easyocr.result == 'success' || needs.deploy-easyocr.result == 'skipped') && 'success' || 'failure' }}
          title: "GPU EasyOCR CI/CD Result"
          description: |
            **Deploy**: ${{ needs.deploy-easyocr.result == 'success' && '✅' || '❌' }}
            **Branch**: `${{ github.ref_name }}`
          color: "${{ (needs.deploy-easyocr.result == 'success' || needs.deploy-easyocr.result == 'skipped') && 65280 || 16711680 }}"
          username: EasyOCR Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
