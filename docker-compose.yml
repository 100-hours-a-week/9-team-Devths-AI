# v2 서버 구성
# 로컬 테스트: docker-compose up -d
# GPU 포함: docker-compose --profile gpu up -d
# 프로덕션: Redis는 AWS ElastiCache 사용 (환경변수로 주입)
#
# ADR-102: Docker replicas로 수평 확장 (504 타임아웃 완화)
# - ai-endpoint: replicas 2~4 (부하에 따라 조절)
# - celery-worker-extract: text_extract/masking/evaluation 전용 Worker
services:
  # -----------------------------------------
  # 1. AI Endpoint Server (CPU) — ADR-102: replicas 추가
  # -----------------------------------------
  ai-endpoint:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-endpoint:v2
    # container_name 제거 (replicas 사용 시 고유 이름 자동 생성)
    deploy:
      replicas: 4  # ADR-102 Phase 0: 504 타임아웃 완화
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      # ChromaDB (VectorDB)
      - CHROMA_SERVER_HOST=vectordb
      - CHROMA_SERVER_PORT=8000
      # OCR
      - EASYOCR_SERVER_URL=http://easyocr-server:8000
      - CLOVA_OCR_API_URL=${CLOVA_OCR_API_URL:-}
      - CLOVA_OCR_SECRET_KEY=${CLOVA_OCR_SECRET_KEY:-}
      # LLM APIs
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # vLLM (로컬 테스트: Docker 서비스명, 프로덕션: 실제 서버 URL로 교체)
      - GCP_VLLM_BASE_URL=http://exaone-8b:8000
      - VLLM_32B_BASE_URL=http://exaone-32b:8000
      # S3 Storage
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-ap-northeast-2}
      - S3_BUCKET=${S3_BUCKET:-devths-dev}
      # Redis/ElastiCache (세션/태스크 저장소) — ADR-096
      # 프로덕션: AWS ElastiCache URL로 환경변수 주입
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://localhost:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
      # Langfuse (모니터링)
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - vectordb
    networks:
      - ai_network

  # -----------------------------------------
  # 2. Celery Worker (트렌드 크롤링 태스크 처리) — ADR-094/096
  # Redis/ElastiCache 연결은 환경변수로 주입
  # -----------------------------------------
  celery-worker-trend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-endpoint:v2
    container_name: celery_worker_trend
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q trend_crawl
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://localhost:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
      - CHROMA_SERVER_HOST=vectordb
      - CHROMA_SERVER_PORT=8000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TREND_CRAWL_URLS=${TREND_CRAWL_URLS:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      - vectordb
    networks:
      - ai_network

  # -----------------------------------------
  # 2-1. Celery Worker (text_extract/masking/evaluation) — ADR-102
  # 504 타임아웃 해결을 위한 CPU-bound 태스크 전용 Worker
  # -----------------------------------------
  celery-worker-extract:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-endpoint:v2
    container_name: celery_worker_extract
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q text_extract,masking,evaluation -c 2
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://localhost:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
      - CHROMA_SERVER_HOST=vectordb
      - CHROMA_SERVER_PORT=8000
      # LLM APIs (OCR, 분석에 필요)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # OCR
      - CLOVA_OCR_API_URL=${CLOVA_OCR_API_URL:-}
      - CLOVA_OCR_SECRET_KEY=${CLOVA_OCR_SECRET_KEY:-}
      # S3 Storage
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-ap-northeast-2}
      - S3_BUCKET=${S3_BUCKET:-devths-dev}
    depends_on:
      - vectordb
    networks:
      - ai_network

  # -----------------------------------------
  # 3. Celery Beat (스케줄러) — ADR-094/096
  # Redis/ElastiCache 연결은 환경변수로 주입
  # -----------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-endpoint:v2
    container_name: celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://localhost:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://localhost:6379/2}
      - TREND_CRAWL_CRON_MINUTE=${TREND_CRAWL_CRON_MINUTE:-0}
      - TREND_CRAWL_CRON_HOUR=${TREND_CRAWL_CRON_HOUR:-9}
      - TREND_CRAWL_CRON_DAY_OF_WEEK=${TREND_CRAWL_CRON_DAY_OF_WEEK:-1}
    networks:
      - ai_network

  # -----------------------------------------
  # 4. VectorDB (ChromaDB, CPU)
  # -----------------------------------------
  vectordb:
    image: chromadb/chroma:latest
    container_name: chromadb_server
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - ai_network

  # -----------------------------------------
  # 5. Exaone 8B (vLLM, GPU) - profile: gpu
  # -----------------------------------------
  exaone-8b:
    image: vllm/vllm-openai:latest
    container_name: exaone_8b
    ports:
      - "8003:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      vllm serve LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --trust-remote-code
    profiles:
      - gpu
    networks:
      - ai_network

  # -----------------------------------------
  # 6. EasyOCR (GPU) - profile: gpu
  # -----------------------------------------
  easyocr-server:
    build:
      context: ./easyocr_server
      dockerfile: Dockerfile
    image: easyocr-server:v1
    container_name: easyocr_server
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - ai_network

  # -----------------------------------------
  # 7. Exaone 32B (vLLM, GPU) - profile: gpu
  # 로컬 테스트용. 프로덕션에서는 RunPod 서버리스 사용.
  # 프로덕션 시 VLLM_32B_BASE_URL을 RunPod 엔드포인트로 변경.
  # -----------------------------------------
  exaone-32b:
    image: vllm/vllm-openai:latest
    container_name: exaone_32b
    ports:
      - "8004:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      vllm serve LGAI-EXAONE/EXAONE-3.5-32B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --trust-remote-code
    profiles:
      - gpu
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  chroma_data:
